name: Release

# Publishes the Frinus MCP on every version tag:
#   1) npm package  -> powers `npx -y frinus-mcp@latest` (Claude Code, Cursor, Codex)
#   2) .mcpb bundle -> attached to the GitHub Release for the Claude Desktop one-click install
#
# Trigger:
#   npm version <patch|minor|major>   # creates the vX.Y.Z tag
#   git push --follow-tags
#
# Required repo secret:
#   NPM_TOKEN  - npm automation token with publish rights to "frinus-mcp"
#                (Settings -> Secrets and variables -> Actions)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: write # create the GitHub Release + upload the .mcpb asset
  id-token: write # npm publish --provenance (OIDC)

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify tag matches package.json version
        run: |
          PKG_VERSION="v$(node -p "require('./package.json').version")"
          TAG="${GITHUB_REF_NAME}"
          echo "package.json: ${PKG_VERSION} | tag: ${TAG}"
          if [ "${GITHUB_EVENT_NAME}" = "push" ] && [ "${PKG_VERSION}" != "${TAG}" ]; then
            echo "::error::Tag ${TAG} does not match package.json version ${PKG_VERSION}"
            exit 1
          fi

      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Pack .mcpb bundle
        run: npm run pack:mcpb

      # Toda release do MCP TEM de carregar o instalador cliente. O guia PDF usa
      #   https://github.com/frinus-ai/frinus-mcp/releases/latest/download/Instalar-Frinus.cmd
      # que baixa o .cmd da release "Latest". O instalador vive nas tags
      # client-installer-v* (nao em main), entao buscamos o .cmd da tag
      # client-installer mais recente. O job FALHA se o .cmd nao vier.
      - name: Fetch current Frinus client installer (.cmd)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG=$(gh api --paginate "repos/${{ github.repository }}/tags" --jq '.[].name' \
                | grep -E '^client-installer-v[0-9]+$' | sort -V | tail -1)
          if [ -z "${TAG:-}" ]; then
            echo "::error::Nenhuma tag client-installer-v* encontrada; instalador cliente ausente."
            exit 1
          fi
          echo "Instalador cliente vigente: $TAG"
          curl -fsSL "https://raw.githubusercontent.com/${{ github.repository }}/$TAG/install/Instalar-Frinus.cmd" -o Instalar-Frinus.cmd
          test -s Instalar-Frinus.cmd
          grep -q 'setup.ps1' Instalar-Frinus.cmd
          echo "OK: Instalar-Frinus.cmd ($(wc -c < Instalar-Frinus.cmd) bytes) de $TAG"

      - name: Create GitHub Release with .mcpb + installer
        uses: softprops/action-gh-release@v2
        with:
          # fail_on_unmatched_files faz o job FALHAR se qualquer item nao existir
          # (ex.: Instalar-Frinus.cmd ausente) — garante que nenhuma release do
          # MCP seja publicada sem o instalador cliente.
          files: |
            frinus.mcpb
            Instalar-Frinus.cmd
          generate_release_notes: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
